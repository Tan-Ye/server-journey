# trade-core 本地开发环境
# Postgres 17 + Redis 7
#
# 用法（在 projects/trade-core/ 下）：
#   docker compose up -d          启动
#   docker compose ps             看状态，STATUS 应为 healthy 而非仅 Up
#   docker compose logs -f pg     跟踪日志
#   docker compose down           停止（保留数据卷）
#   docker compose down -v        停止并删除数据（重置环境，慎用）
#
# ⚠️ 宿主端口是 5433 / 6380，不是默认的 5432 / 6379。
#    本机已装原生 PostgreSQL 18 占用 5432，容器必须错开，
#    否则「两个进程抢同一端口」，宿主连接会路由到原生实例而不是容器。
#
# 连上容器（不装 psql / redis-cli 也能用）：
#   docker compose exec pg psql -U trade -d trade_core
#   docker compose exec redis redis-cli

name: trade-core

services:
  pg:
    # 固定大版本，不用 latest —— 避免哪天拉镜像行为变了，排查半天
    image: postgres:17-alpine
    container_name: trade-core-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade_dev_pw
      POSTGRES_DB: trade_core
      # ⚠️ 这两行是必须的，不是可选的。
      #
      # 症状：sqlx 报
      #   "Postgres protocol error: Postgres returned a non-UTF-8 string for its error message"
      # 根因：不指定时容器回退到系统 locale，PostgreSQL 会把**错误消息翻译成中文**，
      #       而该消息目录的编码不是 UTF-8，于是 sqlx 解析 ErrorResponse 时直接失败。
      #       结果是**任何**数据库错误都变成这条看不懂的协议错误，真实原因全被掩盖。
      #       （实测：服务端返回的 S/M 字段字节解不出合法 UTF-8，SQLSTATE 却正常）
      # 修法：钉住 locale 为 UTF-8，让消息走英文目录或不翻译。
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # ⚠️ 宿主端口用 5433，不是 5432。
      #
      # 原因：本机已安装原生 PostgreSQL 18（Windows 服务 postgresql-x64-18），
      # 它占用了宿主的 5432。若容器也发布到 5432，会出现「两个进程抢同一端口」，
      # 实际路由到哪一个是不可预期的 —— 症状是连上去被告知密码错误，
      # 因为连到的其实是**另一个** PostgreSQL 实例，而不是我们的容器。
      # 容器内部仍然是标准的 5432（这是 PostgreSQL 的默认端口，不改）。
      - "5433:5432"
    volumes:
      # 命名卷：容器删了数据还在 —— DoD #8 的备份恢复演练要靠它
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 关键：容器「起来了」≠「能连了」。没有这个，迁移会在数据库还没就绪时失败。
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_core"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - trade-net

  redis:
    image: redis:7-alpine
    container_name: trade-core-redis
    restart: unless-stopped
    command:
      # appendonly yes：开启 AOF 持久化。延迟队列（超时取消）就存在 Redis 里，
      # 丢了会导致「订单永远不被取消」—— 虽然有扫描兜底，但没必要让它兜。
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      # 同理，宿主用 6380 避开可能的冲突（容器内仍是标准 6379）
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - trade-net

volumes:
  pgdata:
    name: trade-core-pgdata
  redisdata:
    name: trade-core-redisdata

networks:
  trade-net:
    name: trade-core-net
    driver: bridge
